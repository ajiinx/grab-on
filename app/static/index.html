<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <title>Grab</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Grab</span>
    </div>
    <span id="health" class="health" title="Server status"></span>
  </header>

  <main>
    <div id="banner" class="banner" role="status" hidden></div>

    <form id="url-form" class="search" autocomplete="off">
      <label for="url" class="sr-only">Video link</label>
      <input id="url" name="url" type="url" inputmode="url" enterkeyhint="go"
             placeholder="Paste a YouTube, Instagram, Spotify or Twitter/X link" spellcheck="false" autocapitalize="off" required>
      <button type="button" id="paste-btn" class="btn ghost" hidden>Paste</button>
      <button type="submit" id="go-btn" class="btn primary"><span class="btn-text">Go</span><span class="spinner" aria-hidden="true"></span></button>
    </form>
    <p class="hint">YouTube videos, Shorts &amp; playlists · Instagram reels &amp; posts · Spotify songs, albums &amp; playlists · Twitter/X videos</p>

    <div id="error" class="alert" role="alert" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5m0 3.5v.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="error-text"></span>
    </div>

    <section id="preview" class="card preview" hidden>
      <div class="thumb">
        <img id="thumb" alt="" referrerpolicy="no-referrer">
        <span id="duration" class="badge" hidden></span>
      </div>
      <div class="meta">
        <span id="platform" class="pill"></span>
        <h2 id="title"></h2>
        <p id="uploader" class="muted"></p>
        <p id="match" class="match muted" hidden>Audio from YouTube: <a id="match-link" target="_blank" rel="noopener noreferrer"></a></p>
        <button type="button" id="open-playlist" class="link-btn" hidden>Open the whole playlist →</button>
      </div>
    </section>

    <section id="playlist" class="card playlist" aria-label="Playlist items" hidden>
      <div class="playlist-head">
        <span id="playlist-count" class="num"></span>
        <div class="playlist-actions">
          <button type="button" id="select-all" class="link-btn">All</button>
          <button type="button" id="select-none" class="link-btn">None</button>
        </div>
      </div>
      <ul id="playlist-list" class="playlist-list"></ul>
    </section>

    <div id="subs-row" class="subs-row" hidden>
      <label for="subs">Subtitles</label>
      <select id="subs"></select>
      <span class="muted">Added to video downloads</span>
    </div>

    <section id="options" class="options" aria-label="Download options" hidden></section>

    <section id="progress" class="card progress" aria-live="polite" hidden>
      <div class="progress-head">
        <span id="stage">Starting…</span>
        <span id="percent" class="num"></span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill"></div></div>
      <div class="progress-foot muted">
        <span id="speed" class="num"></span>
        <span id="eta" class="num"></span>
      </div>
      <ul id="result-files" class="result-files" hidden></ul>
      <div class="progress-actions">
        <button type="button" id="cancel-btn" class="btn ghost small">Cancel</button>
        <a id="save-btn" class="btn primary small" hidden>Save file</a>
      </div>
    </section>

    <section class="history">
      <div class="section-head">
        <h3>History</h3>
        <span id="history-count" class="muted"></span>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="muted empty">Your downloads will show up here.</p>
    </section>
  </main>

  <footer id="footer" class="muted"></footer>
</body>
</html>
